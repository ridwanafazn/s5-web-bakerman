name: bakerman-prod

services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: bakerman-prod-mongo
    restart: unless-stopped
    volumes:
      - bakerman-prod-mongo-data:/data/db
      - bakerman-prod-mongo-configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
    container_name: bakerman-prod-api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5050
      STRAVA_DEMO_MODE: "false"
      CLOUDINARY_MOCK: "false"
      DISABLE_CLOUDINARY_CLEANUP_JOB: "false"
      LOG_REQUESTS: "true"
      TRUST_PROXY: "1"
    volumes:
      - ./server/service-account.json:/app/service-account.json:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5050/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: bakerman-prod-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bakerman-prod-mongo-data:
  bakerman-prod-mongo-configdb:
